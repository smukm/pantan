global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pantan
    static_configs:
      - targets: ["pantan:8033"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'brend-logo'
    scrape_interval: 15s
    static_configs:
      #- targets: [ 'localhost:80' ]  # ваш хост
      - targets: ['host.docker.internal:80']
    metrics_path: /metrics
    params:
      format: [ prometheus ]