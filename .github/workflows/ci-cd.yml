name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *'  # Ежедневный запуск в 2:00 ночи (опционально)

env:
  # Выберите ваш регистр: ghcr.io (GitHub) или docker.io (Docker Hub)
  REGISTRY: ghcr.io
  # Для Docker Hub: REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  # Для Docker Hub: IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/pantan

jobs:
  # ============ ЗАДАНИЕ 1: КАЧЕСТВО КОДА ============
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -l .)" ]; then
            echo "❌ Files not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files formatted"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
          # Если используете конфиг .golangci.yml, он будет загружен автоматически

      - name: Run tests with race detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run security check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============ ЗАДАНИЕ 2: СБОРКА И ПУБЛИКАЦИЯ ============
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    # Запускаем только для main/master при пуше
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (для мультиархитектурности)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Вход в GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Вход в Docker Hub (опционально)
      - name: Log in to Docker Hub
        if: env.REGISTRY == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64  # Мультиархитектурная сборка
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  # ============ ЗАДАНИЕ 3: ДЕПЛОЙ НА ХОСТИНГ (ОПЦИОНАЛЬНО) ============
  deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Раскомментируйте, если у вас есть сервер для деплоя
    # environment: production
    # concurrency: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            # Пример команды для обновления контейнера на сервере
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop pantan-app || true
            docker rm pantan-app || true
            docker run -d --name pantan-app -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
