name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smukm/pantan
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ============ ЗАДАНИЕ 1: КАЧЕСТВО КОДА ============
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -l .)" ]; then
            echo "❌ Files not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "✅ All files formatted"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.63.4

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --out-format=colored-line-number --go=1.25

      - name: Run tests with race detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run security check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./cmd/... ./internal/... || echo "⚠️ Vulnerabilities found (non-blocking)"
        continue-on-error: true

  # ============ ЗАДАНИЕ 2: СБОРКА И ПУБЛИКАЦИЯ ============
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  # ============ ЗАДАНИЕ 3: ДЕПЛОЙ НА ХОСТИНГ ============
  deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    concurrency: production

    outputs:
      deploy_status: ${{ job.status }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            sudo systemctl restart docker
            sleep 2
            # в эту директорию нужно закинуть папку Docker
            # и файлы .env и docker-compose.prod.yml
            cd /var/www/www-root/data/stats
            
            # Логинимся в GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling latest image..."
            #docker pull ghcr.io/${{ github.repository }}:latest
            docker compose -f docker-compose.prod.yml pull
            
            echo "🛑 Stopping old container..."
            #docker stop pantan-app || true
            #docker rm pantan-app || true
            docker compose -f docker-compose.prod.yml down || true
            
            # Запускаем все сервисы
            echo "🚀 Starting all services..."
            docker compose -f docker-compose.prod.yml up -d
          
            #echo "🚀 Starting new container..."
            #docker run -d --name pantan-app -p 8033:8033 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Проверяем статус
            echo "✅ Checking service status..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps
          
            # Очищаем неиспользуемые образы
            docker image prune -f

  # ============ ЗАДАНИЕ 4: СОЗДАНИЕ РЕЛИЗА С OPENROUTER ============
  create-release:
    name: Create Release with OpenRouter
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      notes: ${{ steps.release_notes.outputs.notes }}
      model_used: ${{ steps.release_notes.outputs.model_used }}
      release_created: ${{ steps.create_release.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit history
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h) by %an" --no-merges)
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git log --pretty=format:"- %s (%h) by %an" --no-merges)
            echo "last_tag=none" >> $GITHUB_OUTPUT
          fi
          
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "commit_count=$(echo "$COMMITS" | wc -l)" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: files
        run: |
          if [ -n "${{ steps.commits.outputs.last_tag }}" ] && [ "${{ steps.commits.outputs.last_tag }}" != "none" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ steps.commits.outputs.last_tag }}..HEAD | head -30)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~10..HEAD | head -30)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get repository info
        id: repo_info
        run: |
          echo "repo_name=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "repo_description=${{ github.event.repository.description }}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes with OpenRouter
        id: release_notes
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const commits = `${{ steps.commits.outputs.commits }}`;
            const changedFiles = `${{ steps.files.outputs.files }}`;
            const repoName = `${{ steps.repo_info.outputs.repo_name }}`;
            const repoDescription = `${{ steps.repo_info.outputs.repo_description }}`;
            
            if (!process.env.OPENROUTER_API_KEY) {
              core.warning('OpenRouter API key not found. Using fallback release notes.');
              const fallbackNotes = generateFallbackNotes(commits, changedFiles);
              core.setOutput('notes', fallbackNotes);
              core.setOutput('model_used', 'fallback');
              return;
            }
            
            const prompt = `
            Generate professional release notes for ${repoName} project.
            
            Repository description: ${repoDescription || 'Go application'}
            
            Commits in this release:
            ${commits}
            
            Changed files:
            ${changedFiles || 'No specific file changes listed'}
            
            Please structure the release notes as follows:
            1. Title: "🚀 Release [date]"
            2. Summary of changes (2-3 sentences)
            3. Major features (if any)
            4. Minor changes and improvements
            5. Bug fixes (if any)
            6. Technical notes
            7. Deployment information
            
            Make it clear, concise, and professional. Use emojis for sections.
            Format in Markdown.
            `;
            
            try {
              const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': 'https://github.com/${{ github.repository }}',
                  'X-Title': 'Release Notes Generator'
                },
                body: JSON.stringify({
                  model: 'nvidia/nemotron-3-ultra-550b-a55b:free',
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a professional release notes generator for software projects. Create clear, structured, and informative release notes.'
                    },
                    {
                      role: 'user',
                      content: prompt
                    }
                  ],
                  temperature: 0.7,
                  max_tokens: 1000,
                  top_p: 0.9,
                })
              });
            
              if (!response.ok) {
                const errorData = await response.text();
                throw new Error(`OpenRouter API error: ${response.status} - ${errorData}`);
              }
            
              const data = await response.json();
            
              if (data.choices && data.choices[0] && data.choices[0].message) {
                const notes = data.choices[0].message.content;
                core.setOutput('notes', notes);
                core.setOutput('model_used', data.model || 'unknown');
                core.info('✅ Release notes generated with OpenRouter');
              } else {
                throw new Error('Unexpected response format from OpenRouter');
              }
            } catch (error) {
              core.warning(`OpenRouter generation failed: ${error.message}`);
              const fallbackNotes = generateFallbackNotes(commits, changedFiles);
              core.setOutput('notes', fallbackNotes);
              core.setOutput('model_used', 'fallback');
            }
            
            function generateFallbackNotes(commits, changedFiles) {
              let notes = `## 🚀 Release ${new Date().toISOString().split('T')[0]}\n\n`;
              notes += `### 📝 Changes in this release:\n\n`;
              notes += `${commits || 'No commits found'}\n\n`;
            
              if (changedFiles) {
                notes += `### 📁 Changed files:\n\`\`\`\n${changedFiles}\n\`\`\`\n\n`;
              }
            
              notes += `### 🔧 Deployment info:\n`;
              notes += `- Image: ghcr.io/${{ github.repository }}:latest\n`;
              notes += `- Deployed to: Production\n`;
              notes += `- Deployed at: ${new Date().toISOString()}\n`;
              notes += `- Commit: ${{ github.sha }}\n`;
              notes += `- Author: ${{ github.actor }}\n`;
            
              return notes;
            }

      - name: Save Release Notes to File
        run: |
          echo "${{ steps.release_notes.outputs.notes }}" > release_notes.md
          echo "Generated with model: ${{ steps.release_notes.outputs.model_used }}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.sha }}
          tag_name: release-${{ github.sha }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  # ============ ЗАДАНИЕ 5: ОТПРАВКА УВЕДОМЛЕНИЙ ============
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy, create-release]
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Check deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.create-release.result }}" == "success" ]; then
            echo "status=✅ Deployment successful!" >> $GITHUB_OUTPUT
            echo "color=success" >> $GITHUB_OUTPUT
            echo "emoji=🚀" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Deployment failed!" >> $GITHUB_OUTPUT
            echo "color=failure" >> $GITHUB_OUTPUT
            echo "emoji=💥" >> $GITHUB_OUTPUT
          fi

      - name: Send to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ steps.status.outputs.emoji }} **Deployment Status**
            
            📦 Repository: ${{ github.repository }}
            🔖 Branch: ${{ github.ref_name }}
            📝 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
            📊 Status: ${{ steps.status.outputs.status }}
            🤖 Model: ${{ needs.create-release.outputs.model_used || 'N/A' }}
            
            📝 Release Notes:
            ${{ needs.create-release.outputs.notes || 'No release notes' }}
